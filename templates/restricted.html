<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Portfolio | Access Restricted</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center space-y-6 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
    <div class="w-16 h-16 mx-auto bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-2xl font-bold">
      🔒
    </div>
    <h1 class="text-2xl font-bold text-white">Portfolio Access Restricted</h1>
    <p class="text-sm text-slate-400">
      This portfolio is currently in private mode for scheduled updates. If you are the owner, please sign in through the admin panel.
    </p>
    <a href="/admin/" class="inline-block px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold">
      Owner Sign In (/admin/)
    </a>
  </div>
</body>
</html>
